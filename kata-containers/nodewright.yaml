apiVersion: nodewright.nvidia.com/v1alpha1
kind: NodeWright
metadata:
  name: kata-containers
spec:
  runtimeRequired: true
  autoTaintNewNodes: true
  nodeSelectors:
    matchLabels:
      nodewright.nvidia.com/kata-profile: kata-containers
      kubernetes.io/os: linux
    matchExpressions:
    - key: kubernetes.io/arch
      operator: In
      values:
      - amd64
      - arm64
  interruptionBudget:
    count: 1
  packages:
    kata-containers:
      image: ghcr.io/nvidia/nodewright-packages/kata-containers
      version: 4.3.1
      # Kata restarts the detected distro service during config; noop keeps
      # NodeWright's cordon/drain flow without restarting the service twice.
      interrupt:
        type: noop
      configInterrupts:
        '*':
          type: noop
      uninstall:
        enabled: true
        apply: false
      gracefulShutdown: 10m
      resources:
        cpuRequest: 250m
        cpuLimit: '1'
        memoryRequest: 256Mi
        memoryLimit: 1Gi
      env:
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            apiVersion: v1
            fieldPath: spec.nodeName
      - name: CONTAINERD_CONFIG_FILE_NAME
        value: config.toml
      - name: KATA_SMOKE_API_HOST
        value: $(KUBERNETES_SERVICE_HOST)
      - name: KATA_SMOKE_API_PORT
        value: $(KUBERNETES_SERVICE_PORT)
      - name: KATA_SMOKE_TOKEN
        valueFrom:
          secretKeyRef:
            name: kata-containers-smoke-token
            key: token
      - name: KATA_SMOKE_CA
        valueFrom:
          secretKeyRef:
            name: kata-containers-smoke-token
            key: ca.crt
      - name: DEBUG
        value: 'false'
      configMap:
        containerd-user-dropin.toml: |
          [plugins.'io.containerd.snapshotter.v1.erofs']
            enable_fsverity = false
