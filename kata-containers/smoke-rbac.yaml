# Apply alongside nodewright.yaml. The token Secret belongs to the operator
# namespace; its Role grants access only to pods in the isolated test namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: kata-containers-smoke
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kata-containers-smoke
  namespace: nodewright
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: kata-containers-smoke-token
  namespace: nodewright
  annotations:
    kubernetes.io/service-account.name: kata-containers-smoke
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kata-containers-smoke
  namespace: kata-containers-smoke
rules:
- apiGroups: ['']
  resources: [pods]
  verbs: [get, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kata-containers-smoke
  namespace: kata-containers-smoke
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kata-containers-smoke
subjects:
- kind: ServiceAccount
  name: kata-containers-smoke
  namespace: nodewright
