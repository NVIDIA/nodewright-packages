# CodeRabbit configuration for skyhook-packages (NodeWright Packages).
# Schema: https://docs.coderabbit.ai/reference/yaml-template
# Adapted from the operator repo's config for this shell-based packages repo:
# shellcheck is the relevant linter, the Go tooling is dropped, and the
# knowledge base points at this repo's guidance docs.

language: en-US

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: false
  poem: false
  review_status: false
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - ".*"
  path_filters:
    # Generated by git-cliff (see cliff.toml / release.yml); not hand-authored.
    - "!**/CHANGELOG.md"
    - "!**/RELEASE_NOTES.md"
    # Test fixtures and build/output directories.
    - "!**/testdata/**"
    - "!**/dist/**"
    - "!**/bin/**"
  tools:
    # Shell is the primary language in this repo; keep shellcheck on. Rule
    # configuration is shared with CI via .shellcheckrc.
    shellcheck:
      enabled: true
    # YAML is plentiful here (workflows, package config); leave yamllint off to
    # avoid style noise, matching the operator repo.
    yamllint:
      enabled: false
  pre_merge_checks:
    docstrings:
      # Quoted so YAML does not coerce "off" to the boolean false.
      mode: "off"

knowledge_base:
  opt_out: false
  code_guidelines:
    enabled: true
    filePatterns:
      # How we write code and ship packages in this repo.
      - AGENTS.md
      - CONTRIBUTING.md
      - README.md
      - DEVELOPER.md
      - PACKAGE_LIFECYCLE.md

chat:
  auto_reply: true
