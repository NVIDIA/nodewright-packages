# git-cliff configuration — https://git-cliff.org/docs/configuration
#
# Per-package generation:
#   git cliff --include-path "<pkg>/**" --tag-pattern "<pkg>/.*"
# Or via make:
#   make changelog PACKAGE=nvidia-setup

[changelog]
header = """
# Changelog

All notable changes to this package will be documented in this file.

"""
body = """
{% if version %}\
    ## [{{ version | split(pat="/") | last }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {{ commit.message | upper_first }}\
            {% if commit.remote.username %} by [@{{ commit.remote.username }}](https://github.com/{{ commit.remote.username }}){%- endif %}\
    {% endfor %}
{% endfor %}\n
"""
footer = """
<!-- Generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_preprocessors = [
    # Remove PR number references from commit messages
    { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "" },
]
commit_parsers = [
    { message = "^feat", group = "New Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^bug", group = "Bug Fixes" },
    { message = "^docs:", skip = true },
    { message = "^test:", skip = true },
    { message = "^lint:", skip = true },
    { message = "^chore: rename", skip = true },
    { message = "^chore: update CHANGELOG", skip = true },
    { message = ".*", group = "Other Tasks" },
]
protect_breaking_commits = false
filter_commits = false
# Match all per-package tags: nvidia-setup/0.2.1, tuned/1.2.0, shellscript/1.1.1, etc.
tag_pattern = "[a-z-]+/[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
