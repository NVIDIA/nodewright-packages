[main]
include=nvidia-gb200-performance
summary=Optimized for inference workloads (AWS-compatible)

[bootloader]
# Allocate hugepages for better memory access. default_hugepagesz is pinned to 2M because
# the default follows the PMD level, which is 512M on the 64k page-size kernel these arm64
# platforms run. This profile allocates no 512M pages, so without the pin a hugetlb caller
# that does not request a size would draw from an empty pool instead of the 8192-page 2M one.
cmdline_hugepages=hugepagesz=2M hugepages=8192 default_hugepagesz=2M

[sysctl]
# Minimize latency
vm.swappiness=1
# Note: kernel.sched_latency_ns and kernel.sched_min_granularity_ns are not available on AWS kernels
