[bootloader]
# Oracle OCI HPC-style cx8 base cmdline. BDF-specific pci=config_acs is applied on Ubuntu
# via cx8-pci-config-acs.grub + script.sh unless NVIDIA_TUNED_OKE_SKIP_PCI_CONFIG_ACS is set.
cmdline_oke_cx8_cstate=processor.max_cstate=1
cmdline_oke_cx8_mce=mce=ignore_ce
cmdline_oke_cx8_skew=skew_tick=1
cmdline_oke_cx8_iommu=iommu=on
cmdline_oke_cx8_numa=numa_balancing=disable
