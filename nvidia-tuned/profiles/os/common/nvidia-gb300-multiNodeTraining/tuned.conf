[main]
include=nvidia-gb300-performance
summary=Multi-node training on GB300 (same tuning as nvidia-gb300-performance)

# Shim profile. prepare_nvidia_profiles.sh builds the profile name as
# nvidia-<accelerator>-<intent> and exits non-zero when that directory is missing, so
# intent=multiNodeTraining was unavailable on gb300 rather than falling back. The network
# buffer and TCP tuning the gb200 and vr200 multiNodeTraining profiles carry has not been
# validated on gb300, so this resolves to the performance profile instead. Add [sysctl]
# overrides here once gb300 training tuning is measured.
