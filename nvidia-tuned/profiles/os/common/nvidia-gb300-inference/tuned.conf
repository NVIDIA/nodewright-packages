[main]
include=nvidia-gb300-performance
summary=Inference on GB300 (same tuning as nvidia-gb300-performance)

# Shim profile. prepare_nvidia_profiles.sh builds the profile name as
# nvidia-<accelerator>-<intent> and exits non-zero when that directory is missing, so
# intent=inference was unavailable on gb300 rather than falling back. There is no
# inference-specific tuning validated on this platform yet, so this resolves to the
# performance profile instead of carrying an unverified delta. Add [bootloader] or
# [sysctl] overrides here once gb300 inference tuning is measured.
