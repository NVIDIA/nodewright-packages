[main]
include=nvidia-gb200-performance
summary=Optimized for inference workloads

[bootloader]
# Allocate hugepages for better memory access
cmdline_hugepages=hugepagesz=2M hugepages=8192

[sysctl]
# Minimize latency
vm.swappiness=1
# kernel.sched_latency_ns and kernel.sched_min_granularity_ns omitted: these CFS sysctls
# were removed in kernel 6.8+ (EEVDF replaced CFS). Ubuntu 22.04 deployments set these
# in the OS-specific inference overrides.
