[main]
summary=GB300 base without reboot-requiring (bootloader) settings

[cpu]
governor=performance

[modules]
ib_umad=+r opt1=noop

[sysctl]
# arp settings carried over from nvidia-base
net.ipv4.conf.all.arp_announce = 2
net.ipv4.conf.default.arp_announce = 2
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.default.arp_ignore = 1
# gb300 performance sysctls
fs.inotify.max_user_instances=65535
fs.inotify.max_user_watches=524288
kernel.threads-max=16512444
# vm.max_map_count omitted: systemd v255 (Ubuntu 24.04+) sets 1048576 by default, which is
# higher than 262144; tuned-adm verify fails when trying to lower a value already set higher.
vm.min_free_kbytes=65536
vm.overcommit_memory=1

# No [script] here on purpose: only one [script] survives tuned's include chain, so it
# is left to the including service profile (e.g. oci).
