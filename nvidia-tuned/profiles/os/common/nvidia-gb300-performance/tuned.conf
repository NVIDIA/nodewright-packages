[main]
include=nvidia-base
summary=TuneD Profile for DGX GB300

[bootloader]
cmdline_iommu=iommu.passthrough=1
cmdline_console=console=tty0 console=ttyS0,115200n8
cmdline_init_on_alloc=init_on_alloc=0
cmdline_numa_balancing=numa_balancing=disable
cmdline_earlycon=earlycon
# Allocate hugepages for better memory access. Sized for the 64k page-size kernel these
# platforms run (linux-image-*-aws-64k): a 64k granule registers 2M, 512M and 16G huge
# pages and has no PUD level, so hugepagesz=1G is rejected at boot and the hugepages=
# paired with it is dropped too. 4 x 512M keeps the 2G of large pages that 2 x 1G gave.
# default_hugepagesz is pinned to 2M because the default follows the PMD level, which is
# 512M on a 64k granule; without it, hugetlb callers that do not request a size would draw
# from the 4-page 512M pool instead of the large 2M one.
cmdline_hugepages=hugepagesz=2M hugepages=5128 hugepagesz=512M hugepages=4 default_hugepagesz=2M

# Generally not useful for VMs and dont work in aws
# [modules]
# acpi_power_meter=force_cap_on=y
# arm_cspmu_module=

[sysctl]
fs.inotify.max_user_instances=65535
fs.inotify.max_user_watches=524288
kernel.threads-max=16512444
# vm.max_map_count omitted: systemd v255 (Ubuntu 24.04+) sets 1048576 by default, which is
# higher than 262144; tuned-adm verify fails when trying to lower a value already set higher.
vm.min_free_kbytes=65536
vm.overcommit_memory=1
