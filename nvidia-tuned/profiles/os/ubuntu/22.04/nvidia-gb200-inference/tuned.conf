[main]
include=nvidia-gb200-performance
summary=Optimized for inference workloads

[bootloader]
# Allocate hugepages for better memory access
cmdline_hugepages=hugepagesz=2M hugepages=8192

[sysctl]
# Minimize latency
vm.swappiness=1
# vm.max_map_count not set by common nvidia-gb200-performance on Ubuntu 24.04+ (systemd v255
# default of 1048576 is already higher); set here for Ubuntu 22.04 where default is 65536.
vm.max_map_count=262144
# Optimize for response time
kernel.sched_latency_ns=1000000
kernel.sched_min_granularity_ns=100000
