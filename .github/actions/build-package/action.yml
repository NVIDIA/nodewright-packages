name: 'Build Package'
description: 'Common steps for building and pushing Docker images'

inputs:
  package_name:
    required: true
    description: 'Name of the package to build'
  tags:
    required: true
    description: 'Docker tags to apply (can be multiline YAML string)'
  registry:
    required: false
    default: 'ghcr.io'
    description: 'Container registry domain'
  image_name:
    required: false
    description: 'Base image name (repository name)'
  build_args:
    required: false
    default: ''
    description: 'Build arguments from preprocess script'
  generate_attestation:
    required: false
    default: 'false'
    description: 'Whether to generate artifact attestation'
  sign_image:
    required: false
    default: 'false'
    description: 'Whether to sign the pushed image with a keyless cosign signature'
  save_image_info:
    required: false
    default: 'false'
    description: 'Whether to save image tags to an artifact (for PR builds)'
  github_token:
    required: true
    description: 'GitHub token for registry authentication (pass secrets.GITHUB_TOKEN from the calling workflow)'
  skyhook_agent_image:
    required: false
    default: 'ghcr.io/nvidia/skyhook/agent:latest'
    description: 'Skyhook agent container image to use for validation'

outputs:
  image_tags:
    description: 'The tags that were applied to the built image'
    value: ${{ steps.meta.outputs.tags }}
  image_digest:
    description: 'The digest of the built image'
    value: ${{ steps.push.outputs.digest }}

runs:
  using: 'composite'
  steps:
    - name: Log in to the Container registry
      uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}

    - name: Generate package version map
      id: package-versions
      shell: bash
      run: |
        # Get all tags, extract package/version pairs, find latest for each package
        PACKAGE_VERSIONS=$(git tag -l | \
          grep -E '^[^/]+/[0-9]+\.[0-9]+\.[0-9]+$' | \
          sort -t/ -k1,1 -k2,2V | \
          awk -F/ '
            {
              package = $1
              version = $2
              packages[package] = version
            }
            END {
              printf "{"
              first = 1
              for (package in packages) {
                if (!first) printf ","
                printf "\"%s\":\"%s\"", package, packages[package]
                first = 0
              }
              printf "}"
            }
          ')
        
        echo "PACKAGE_VERSIONS=${PACKAGE_VERSIONS}" >> $GITHUB_OUTPUT
        echo "Generated package version map: ${PACKAGE_VERSIONS}"

    - name: Run preprocess script
      id: preprocess
      shell: bash
      env:
        PACKAGE_VERSIONS: ${{ steps.package-versions.outputs.PACKAGE_VERSIONS }}
      run: |
        echo "PACKAGE_VERSIONS from previous step: ${PACKAGE_VERSIONS}"
        PREPROCESS_SCRIPT="${{ inputs.package_name }}/preprocess.sh"
        if [ -f "$PREPROCESS_SCRIPT" ]; then
          echo "Running preprocess script: $PREPROCESS_SCRIPT"
          chmod +x "$PREPROCESS_SCRIPT"
          "$PREPROCESS_SCRIPT"
        else
          echo "No preprocess script found at $PREPROCESS_SCRIPT"
          echo "BUILD_ARGS=" >> $GITHUB_OUTPUT
        fi

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
      with:
        images: ${{ inputs.registry }}/${{ inputs.image_name }}/${{ inputs.package_name }}
        tags: ${{ inputs.tags }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      id: push
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.package_name }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64,linux/arm64
        build-args: ${{ steps.preprocess.outputs.BUILD_ARGS != '' && steps.preprocess.outputs.BUILD_ARGS || inputs.build_args }}

    - name: Generate artifact attestation
      if: inputs.generate_attestation == 'true'
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
      with:
        subject-name: ${{ inputs.registry }}/${{ inputs.image_name }}/${{ inputs.package_name }}
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true
        # Defaults to true when push-to-registry is true, but that needs
        # artifact-metadata: write, which callers don't grant. We only need the
        # attestation pushed to the registry, not a storage record.
        create-storage-record: false

    - name: Install cosign
      if: inputs.sign_image == 'true'
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

    - name: Sign image (keyless)
      if: inputs.sign_image == 'true'
      shell: bash
      # The reference goes through env rather than inline ${{ }} expansion so
      # tag-derived inputs cannot inject shell into the script.
      env:
        IMAGE_REF: ${{ inputs.registry }}/${{ inputs.image_name }}/${{ inputs.package_name }}@${{ steps.push.outputs.digest }}
      run: |
        # Keyless signature via the GitHub Actions OIDC identity, recorded in
        # the public Rekor transparency log. --recursive signs the manifest-list
        # digest AND every platform-specific child manifest under it, so a pull
        # by a per-architecture digest still verifies. cosign reuses the docker
        # login performed above to push the .sig back to the registry.
        # OCI repository names must be lowercase; image_name comes from
        # github.repository, which carries the uppercase org (NVIDIA/...), so
        # lowercase the reference before handing it to cosign.
        cosign sign --yes --recursive "${IMAGE_REF,,}"

    - name: Save image info
      if: inputs.save_image_info == 'true'
      shell: bash
      run: |
        mkdir -p /tmp/image-info
        echo "${{ steps.meta.outputs.tags }}" > /tmp/image-info/${{ inputs.package_name }}.txt

    - name: Upload image info
      if: inputs.save_image_info == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: image-info-${{ inputs.package_name }}
        path: /tmp/image-info/${{ inputs.package_name }}.txt
        retention-days: 1
