name: 'Build Package'
description: 'Common steps for building and pushing Docker images'

inputs:
  package_name:
    required: true
    description: 'Name of the package to build'
  tags:
    required: true
    description: 'Docker tags to apply (can be multiline YAML string)'
  registry:
    required: false
    default: 'ghcr.io'
    description: 'Container registry domain'
  image_name:
    required: false
    description: 'Base image name (repository name)'
  build_args:
    required: false
    default: ''
    description: 'Build arguments from preprocess script'
  generate_attestation:
    required: false
    default: 'false'
    description: 'Whether to generate artifact attestation'
  sign_image:
    required: false
    default: 'false'
    description: 'Whether to sign the pushed image with a keyless cosign signature'
  save_image_info:
    required: false
    default: 'false'
    description: 'Whether to save image tags to an artifact (for PR builds)'
  push:
    required: false
    default: 'true'
    description: 'Whether to push the built image to the registry. Fork PRs get a read-only token that cannot push (and cannot create a new org package), so callers set this to false to build without publishing.'
  github_token:
    required: true
    description: 'GitHub token for registry authentication (pass secrets.GITHUB_TOKEN from the calling workflow)'
  skyhook_agent_image:
    required: false
    default: 'ghcr.io/nvidia/skyhook/agent:latest'
    description: 'Skyhook agent container image to use for validation'

outputs:
  image_tags:
    description: 'The tags that were applied to the built image'
    value: ${{ steps.meta.outputs.tags }}
  image_digest:
    description: 'The digest of the built image'
    value: ${{ steps.push.outputs.digest }}

runs:
  using: 'composite'
  steps:
    - name: Log in to the Container registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}

    - name: Generate package version map
      id: package-versions
      shell: bash
      run: |
        # Get all tags, extract package/version pairs, find latest for each package
        PACKAGE_VERSIONS=$(git tag -l | \
          grep -E '^[^/]+/[0-9]+\.[0-9]+\.[0-9]+$' | \
          sort -t/ -k1,1 -k2,2V | \
          awk -F/ '
            {
              package = $1
              version = $2
              packages[package] = version
            }
            END {
              printf "{"
              first = 1
              for (package in packages) {
                if (!first) printf ","
                printf "\"%s\":\"%s\"", package, packages[package]
                first = 0
              }
              printf "}"
            }
          ')
        
        echo "PACKAGE_VERSIONS=${PACKAGE_VERSIONS}" >> $GITHUB_OUTPUT
        echo "Generated package version map: ${PACKAGE_VERSIONS}"

    - name: Run preprocess script
      id: preprocess
      shell: bash
      env:
        PACKAGE_VERSIONS: ${{ steps.package-versions.outputs.PACKAGE_VERSIONS }}
      run: |
        echo "PACKAGE_VERSIONS from previous step: ${PACKAGE_VERSIONS}"
        PREPROCESS_SCRIPT="${{ inputs.package_name }}/preprocess.sh"
        if [ -f "$PREPROCESS_SCRIPT" ]; then
          echo "Running preprocess script: $PREPROCESS_SCRIPT"
          chmod +x "$PREPROCESS_SCRIPT"
          "$PREPROCESS_SCRIPT"
        else
          echo "No preprocess script found at $PREPROCESS_SCRIPT"
          echo "BUILD_ARGS=" >> $GITHUB_OUTPUT
        fi

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
      with:
        images: ${{ inputs.registry }}/${{ inputs.image_name }}/${{ inputs.package_name }}
        tags: ${{ inputs.tags }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

    - name: Build and push Docker image
      id: push
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
      with:
        context: ${{ inputs.package_name }}
        push: ${{ inputs.push }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64,linux/arm64
        build-args: ${{ steps.preprocess.outputs.BUILD_ARGS != '' && steps.preprocess.outputs.BUILD_ARGS || inputs.build_args }}

    - name: Generate artifact attestation
      if: inputs.generate_attestation == 'true'
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
      with:
        subject-name: ${{ inputs.registry }}/${{ inputs.image_name }}/${{ inputs.package_name }}
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true
        # Defaults to true when push-to-registry is true, but that needs
        # artifact-metadata: write, which callers don't grant. We only need the
        # attestation pushed to the registry, not a storage record.
        create-storage-record: false

    # actions/attest-build-provenance above and cosign sign below both attach
    # to the same OCI referrers fallback tag (sha256-<digest>), because GHCR
    # does not implement the referrers API. Each attach is a read-modify-write
    # of that tag, so when cosign reads it before the attestation is visible it
    # rewrites the index with only its own signature and the provenance
    # referrer is dropped (this is what failed the nvidia-tuned/0.9.0 release
    # build). Block until the attestation reads back, so cosign appends to the
    # index instead of replacing it.
    - name: Wait for provenance attestation to be readable
      if: inputs.generate_attestation == 'true' && inputs.sign_image == 'true' && inputs.push == 'true'
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        REPOSITORY: ${{ inputs.image_name }}/${{ inputs.package_name }}
        DIGEST: ${{ steps.push.outputs.digest }}
        REGISTRY_TOKEN: ${{ inputs.github_token }}
      run: |
        set -euo pipefail

        # OCI repository names must be lowercase; image_name carries the
        # uppercase org from github.repository (NVIDIA/...).
        repository="${REPOSITORY,,}"
        fallback_tag="sha256-${DIGEST#sha256:}"
        manifest_url="https://${REGISTRY}/v2/${repository}/manifests/${fallback_tag}"

        # Standard registry token exchange: the unauthenticated request answers
        # with the realm and service to ask a pull token for.
        challenge="$(curl -sSI "${manifest_url}" | grep -i '^www-authenticate:' || true)"
        token=""
        if [[ -n "${challenge}" ]]; then
          realm="$(sed -n 's/.*realm="\([^"]*\)".*/\1/p' <<<"${challenge}")"
          service="$(sed -n 's/.*service="\([^"]*\)".*/\1/p' <<<"${challenge}")"
          token="$(curl -sS -u "${GITHUB_ACTOR}:${REGISTRY_TOKEN}" --get \
            --data-urlencode "service=${service}" \
            --data-urlencode "scope=repository:${repository}:pull" \
            "${realm}" | jq -r '.token // .access_token // empty')"
        fi

        for attempt in $(seq 1 30); do
          if curl -sS -H "Authorization: Bearer ${token}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json' \
              "${manifest_url}" \
            | jq -e '[.manifests[]?.annotations."dev.sigstore.bundle.predicateType"]
                     | index("https://slsa.dev/provenance/v1")' > /dev/null 2>&1; then
            echo "Provenance referrer visible on ${fallback_tag} after ${attempt} attempt(s)."
            exit 0
          fi
          sleep 2
        done

        echo "ERROR: the provenance attestation for ${DIGEST} was not readable from ${REGISTRY}/${repository} after 60s." >&2
        echo "Signing now would drop it from the referrers index, so failing instead." >&2
        exit 1

    - name: Install cosign
      if: inputs.sign_image == 'true'
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

    - name: Sign image (keyless)
      if: inputs.sign_image == 'true'
      shell: bash
      # The reference goes through env rather than inline ${{ }} expansion so
      # tag-derived inputs cannot inject shell into the script.
      env:
        IMAGE_REF: ${{ inputs.registry }}/${{ inputs.image_name }}/${{ inputs.package_name }}@${{ steps.push.outputs.digest }}
      run: |
        # Keyless signature via the GitHub Actions OIDC identity, recorded in
        # the public Rekor transparency log. --recursive signs the manifest-list
        # digest AND every platform-specific child manifest under it, so a pull
        # by a per-architecture digest still verifies. cosign reuses the docker
        # login performed above to push the .sig back to the registry.
        # OCI repository names must be lowercase; image_name comes from
        # github.repository, which carries the uppercase org (NVIDIA/...), so
        # lowercase the reference before handing it to cosign.
        cosign sign --yes --recursive "${IMAGE_REF,,}"

    - name: Save image info
      if: inputs.save_image_info == 'true'
      shell: bash
      run: |
        mkdir -p /tmp/image-info
        echo "${{ steps.meta.outputs.tags }}" > /tmp/image-info/${{ inputs.package_name }}.txt

    - name: Upload image info
      if: inputs.save_image_info == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: image-info-${{ inputs.package_name }}
        path: /tmp/image-info/${{ inputs.package_name }}.txt
        retention-days: 1
