# Path-based PR labels for actions/labeler. Kept in sync with the package/*
# label family in .github/labels.yml and the triage keyword maps in
# .github/workflows/triage.yaml.
#
# One label per package directory. Packages are independent top-level dirs, so a
# simple '<package>/**' glob per label is unambiguous (e.g. 'tuned/**' does not
# match 'nvidia-tuned/**').

package/copy-fail:
  - changed-files:
      - any-glob-to-any-file:
          - 'copy-fail/**'

package/kdump:
  - changed-files:
      - any-glob-to-any-file:
          - 'kdump/**'

package/nvidia-setup:
  - changed-files:
      - any-glob-to-any-file:
          - 'nvidia-setup/**'

package/nvidia-tuned:
  - changed-files:
      - any-glob-to-any-file:
          - 'nvidia-tuned/**'

package/nvidia-tuning-gke:
  - changed-files:
      - any-glob-to-any-file:
          - 'nvidia-tuning-gke/**'

package/shellscript:
  - changed-files:
      - any-glob-to-any-file:
          - 'shellscript/**'

package/tuned:
  - changed-files:
      - any-glob-to-any-file:
          - 'tuned/**'

package/tuning:
  - changed-files:
      - any-glob-to-any-file:
          - 'tuning/**'

component/ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'scripts/**'
          - '**/[Mm]akefile'
          - '**/*.mk'

tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'tests/**'

doc:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - '**/*.md'
