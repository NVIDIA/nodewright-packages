name: Create GitHub Release

# Triggered on every tag push. Tags in this repo follow the pattern <package>/<version>
# (e.g. nvidia-setup/0.2.2, tuned/1.3.0). Each package is versioned independently.
#
# This workflow runs in parallel with build_container.yaml (which builds and pushes
# the container image). They are independent — this one only creates the GH Release.
#
# Release notes are generated by git-cliff (see cliff.toml), scoped to the tagged
# package using --include-path and --tag-pattern. Only commits touching that package's
# directory are included. The same notes can be previewed locally with:
#   make changelog-preview PACKAGE=<name>

on:
  push:
    tags:
      - '**'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required for gh release create
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for git-cliff to walk all tags

      # Tags are <package>/<version> — extract the package name from the left side.
      # e.g. "nvidia-setup/0.2.2" -> "nvidia-setup"
      - name: Extract package name from tag
        id: extract
        run: |
          PACKAGE_NAME=$(echo "${{ github.ref_name }}" | cut -f 1 -d /)
          echo "package_name=${PACKAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Install git-cliff
        run: |
          curl -sSL "https://github.com/orhun/git-cliff/releases/latest/download/git-cliff-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz --wildcards "*/git-cliff" --strip-components=1
          sudo mv git-cliff /usr/local/bin/

      # Generate release notes for the specific package being released.
      # --include-path scopes commits to the package directory.
      # --tag-pattern scopes version history to this package's tags only.
      # --latest emits only the most recent release (the tag just pushed).
      # --strip all removes the changelog header/footer, leaving just the body.
      - name: Generate release notes
        id: release_notes
        run: |
          PACKAGE="${{ steps.extract.outputs.package_name }}"
          NOTES=$(git cliff \
            --include-path "${PACKAGE}/**" \
            --tag-pattern "${PACKAGE}/.*" \
            --latest \
            --strip all)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "${NOTES}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "${{ steps.release_notes.outputs.notes }}"
