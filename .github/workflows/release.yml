name: Create GitHub Release

# Triggered on every tag push. Tags in this repo follow the pattern <package>/<version>
# (e.g. nvidia-setup/0.2.2, tuned/1.3.0). Each package is versioned independently.
#
# This workflow runs in parallel with build_container.yaml (which builds and pushes
# the container image). They are independent — this one only creates the GH Release.
#
# Release notes are generated by git-cliff (see cliff.toml), scoped to the tagged
# package using --include-path. The release boundary is taken from `git tag` and
# rendered over an explicit tag range (a bare `git-cliff --latest` drops sections
# in this monorepo -- see scripts/gen-changelog.sh). Scoping is asymmetric: a
# stable release covers everything since the previous stable; a release candidate
# (-rc.N) shows only the delta since the prior tag. Any hand-authored entry in the
# package's RELEASE_NOTES.md is prepended. Preview the changelog locally with:
#   make changelog-preview PACKAGE=<name>

on:
  push:
    tags:
      - '**'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required for gh release create
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for git-cliff to walk all tags

      # Tags are <package>/<version> — extract the package name from the left side.
      # e.g. "nvidia-setup/0.2.2" -> "nvidia-setup"
      - name: Extract package name from tag
        id: extract
        run: |
          PACKAGE_NAME=$(echo "${{ github.ref_name }}" | cut -f 1 -d /)
          echo "package_name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"

      # git-cliff release assets are versioned in the filename
      # (e.g. git-cliff-2.13.1-x86_64-unknown-linux-gnu.tar.gz), so we resolve the
      # latest tag via the API and build the versioned URL. The API call is authed
      # with GITHUB_TOKEN to avoid the 60/hr anonymous rate limit shared across
      # Actions runner IPs. curl uses -f so a 404 fails fast instead of piping an
      # error page into tar.
      - name: Install git-cliff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/orhun/git-cliff/releases/latest \
            | jq -r .tag_name | sed 's/^v//')
          curl -fsSL "https://github.com/orhun/git-cliff/releases/download/v${VERSION}/git-cliff-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz --wildcards "*/git-cliff" --strip-components=1
          sudo mv git-cliff /usr/local/bin/

      # Generate release notes for the specific package being released.
      # --include-path scopes commits to the package directory.
      # --offline disables GitHub API enrichment (no `by [@user]` links, no 403
      # panic), matching the committed CHANGELOGs.
      # --strip all removes the changelog header/footer, leaving just the body.
      - name: Generate release notes
        id: release_notes
        run: |
          PACKAGE="${{ steps.extract.outputs.package_name }}"
          TAG="${GITHUB_REF_NAME}"          # e.g. nvidia-setup/0.3.0 or nvidia-setup/0.3.0-rc.1
          VERSION="${TAG#*/}"
          INCLUDE_PATH="${PACKAGE}/**"
          # Asymmetric scoping: an RC shows just the delta since the previous tag
          # (rc or stable), useful while iterating. A stable release covers
          # everything since the previous STABLE -- rc tags are excluded as
          # boundaries so stable notes are not truncated to the last-rc delta.
          if [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            # RCs use --latest (delta since prior tag). If the rc commit itself is
            # path-filtered out, BODY can be empty and the body falls back to the
            # RELEASE_NOTES prepend -- an accepted trade-off for low-stakes RCs.
            BODY=$(git cliff --offline --include-path "${INCLUDE_PATH}" \
              --tag-pattern "${PACKAGE}/.*" --latest --strip all)
          elif [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            PREV=$(git tag -l "${PACKAGE}/*" --sort=-v:refname \
              | grep -E "^${PACKAGE}/[0-9]+\.[0-9]+\.[0-9]+$" \
              | grep -v "^${TAG}$" | head -1)
            # When PREV is empty (first stable tag) fall back to ROOT..TAG.
            # A bare single ref emits nothing when the tag's own commit is
            # path-filtered out (same issue documented in gen-changelog.sh).
            if [[ -n "${PREV}" ]]; then
              RANGE="${PREV}..${TAG}"
            else
              ROOT=$(git rev-list --max-parents=0 HEAD | tail -1)
              RANGE="${ROOT}..${TAG}"
            fi
            BODY=$(git cliff --offline --include-path "${INCLUDE_PATH}" \
              --tag-pattern "${PACKAGE}/[0-9]+\.[0-9]+\.[0-9]+$" \
              --tag "${TAG}" "${RANGE}" --strip all)
          else
            echo "ERROR: tag '${TAG}' must match <package>/<MAJOR>.<MINOR>.<PATCH> or <package>/<MAJOR>.<MINOR>.<PATCH>-rc.<N>" >&2
            exit 1
          fi
          # Prepend the human-authored RELEASE_NOTES.md entry for this version, if any.
          # Match a heading that is exactly "## <version>" or "## <version> <suffix>".
          NOTES_FILE="${PACKAGE}/RELEASE_NOTES.md"
          HUMAN=""
          if [[ -f "${NOTES_FILE}" ]]; then
            HUMAN=$(awk -v ver="${VERSION}" '
              { h = "## " ver
                if (index($0, h) == 1) {
                  nc = substr($0, length(h) + 1, 1)
                  if (nc == "" || nc == " ") { f = 1; next }
                } }
              /^## / { if (f) f = 0 }
              f' "${NOTES_FILE}")
          fi
          {
            [ -n "${HUMAN}" ] && printf '%s\n\n' "${HUMAN}"
            printf '%s\n' "${BODY}"
          } > "${RUNNER_TEMP:-/tmp}/notes.md"
          # Use a random delimiter so a literal "EOF" line in release notes can't
          # truncate the multi-line output variable (GitHub Actions requirement).
          GH_DELIM="NOTES_EOF_$(openssl rand -hex 8)"
          { echo "notes<<${GH_DELIM}"; cat "${RUNNER_TEMP:-/tmp}/notes.md"; echo "${GH_DELIM}"; } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Idempotent: skip create if the release already exists so workflow
        # re-runs on the same tag can still succeed.
        run: |
          # Release candidate tags (e.g. nvidia-setup/0.3.0-rc.1) are marked as
          # prerelease so they don't become "Latest" on the Releases page. Only
          # -rc.<N> is accepted; the dot makes version sort order RCs correctly.
          # Any other suffix is rejected to keep the format predictable.
          PRERELEASE_FLAG=""
          VERSION="${GITHUB_REF_NAME#*/}"
          if [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            : # plain release
          elif [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            PRERELEASE_FLAG="--prerelease"
          else
            echo "ERROR: tag '${GITHUB_REF_NAME}' does not match <package>/<MAJOR>.<MINOR>.<PATCH> or <package>/<MAJOR>.<MINOR>.<PATCH>-rc.<N>" >&2
            exit 1
          fi
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes "${{ steps.release_notes.outputs.notes }}" \
              ${PRERELEASE_FLAG}
          fi
