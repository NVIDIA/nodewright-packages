# Enforce Conventional Commits (https://www.conventionalcommits.org) on both
# the PR title and every commit in the PR, using commitlint with
# @commitlint/config-conventional (rules in commitlint.config.js).
#
# The PR title is checked because a squash-merge uses it as the commit
# subject; individual commits are checked because release notes are generated
# from them by git-cliff (see cliff.toml / release.yml).

name: Commit Linting

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: commit-linting-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commit-linting:
    name: commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history so commitlint can walk every commit in the PR range.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # commitlint 21 requires Node >= 22.12.
          node-version: 22

      - name: Install commitlint
        run: npm install --no-save @commitlint/cli@21 @commitlint/config-conventional@21

      # Call the locally-installed binary directly rather than `npx` so a
      # resolution miss fails fast instead of triggering a network install.
      - name: Lint commits in the PR
        run: |
          ./node_modules/.bin/commitlint \
            --config commitlint.config.js \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose

      - name: Lint the PR title
        # PR title is untrusted input; pass it through the environment rather
        # than interpolating it into the shell command.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$PR_TITLE" | ./node_modules/.bin/commitlint --config commitlint.config.js --verbose
