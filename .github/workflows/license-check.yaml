name: License Headers

# Verifies every in-scope source file carries the Apache license header
# (google/addlicense via `make license-check`), then guards against the
# duplicate-header regression from #74: addlicense -check only verifies presence,
# so a second SPDX block would otherwise pass. The guard fails if any in-scope
# file has more than one SPDX-License-Identifier line.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  license:
    name: Check license headers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable

      - name: Check headers (addlicense)
        run: make license-check

      - name: Guard against duplicate headers
        shell: bash
        run: |
          # Count only real header lines: a comment-led "# SPDX-License-Identifier:"
          # at column 1. This ignores prose or shell that merely mentions the
          # string (e.g. this guard itself), avoiding self-referential matches.
          dupes=()
          while IFS= read -r f; do
            n=$(grep -cE '^# SPDX-License-Identifier:' "$f" || true)
            if [ "${n:-0}" -gt 1 ]; then dupes+=("$f (${n} headers)"); fi
          done < <(git ls-files '*.py' '*.sh' '*.yaml' '*.yml' 'Dockerfile' '*/Dockerfile' \
            ':!:chart/**' ':!:**/vendor/**' ':!:**/node_modules/**')
          if [ ${#dupes[@]} -gt 0 ]; then
            echo "::error::Files with duplicate license headers (see #74):"
            printf '  %s\n' "${dupes[@]}" >&2
            exit 1
          fi
          echo "No duplicate license headers."
