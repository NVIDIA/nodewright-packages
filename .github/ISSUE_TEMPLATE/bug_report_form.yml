name: Bug Report
description: File a bug report
title: "[BUG]: "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: input
    id: operator-version
    attributes:
      label: NodeWright Operator Version
      description: What version of the NodeWright Operator are you running?
      placeholder: "example: 0.14.0"
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: Which package does this relate to?
      options:
        - shellscript
        - tuning
        - tuned
        - kdump
        - nvidia-setup
        - nvidia-tuned
        - nvidia-tuning-gke
        - copy-fail
        - General / multiple packages

  - type: input
    id: package-version
    attributes:
      label: Package Name and Version
      description: Which package and version is affected?
      placeholder: "example: shellscript/1.1.1"
    validations:
      required: true

  - type: dropdown
    id: kubernetes
    attributes:
      label: Kubernetes distribution
      multiple: true
      options:
        - EKS
        - GKE
        - AKS
        - On-prem Kubernetes
        - Other

  - type: input
    id: node-os
    attributes:
      label: Node OS
      description: What OS is running on the affected node(s)?
      placeholder: "example: Ubuntu 24.04"

  - type: dropdown
    id: accelerator
    attributes:
      label: Accelerator (if applicable)
      multiple: true
      options:
        - H100
        - GB200
        - Other
        - N/A

  - type: textarea
    id: description
    attributes:
      label: Describe the bug.
      description: Also tell us, what did you expect to happen?
      placeholder: XYZ occurred, I expected QRS results
    validations:
      required: true

  - type: textarea
    id: mvr
    attributes:
      label: Minimum reproducible example
      description: Please provide steps or configuration to reproduce the issue
      render: shell

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please paste relevant error and log output here
      render: shell

  - type: textarea
    id: misc
    attributes:
      label: Other/Misc.
      description: Please enter any other helpful information here.

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/NVIDIA/nodewright-packages/blob/main/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow the project's Code of Conduct
          required: true
        - label: I have searched the [open bugs](https://github.com/NVIDIA/nodewright-packages/issues?q=is%3Aopen+is%3Aissue+label%3Abug) and have found no duplicates for this bug report
          required: true
