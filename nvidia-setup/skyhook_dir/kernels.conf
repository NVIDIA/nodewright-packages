# nvidia-setup kernel catalog: the only file in this package that names a kernel version.
#
# One kernel per line: `<flavor> <track> <release> <kernel ABI>`.
#   flavor   Ubuntu kernel flavor (aws, nvidia, generic). A combination sets KERNEL_FLAVOR=.
#   track    lts (the release's GA kernel, supported for the life of the release) or hwe (its
#            newest hardware-enablement kernel, which moves to a new series at point releases).
#   release  Ubuntu codename, matched against VERSION_CODENAME on the node.
# A combination picks its track per release with KERNEL_TRACK_<release>= in
# defaults/<service>-<accelerator>.conf; a CR overrides it with the `kernel_track` configmap
# key or the NVIDIA_KERNEL_TRACK env var.
#
# The ABI is the base (amd64) name. On arm64, resolve_full_kernel appends the -64k page-size
# flavor, so one line serves both H100 and Grace.
#
# Each line follows a series-scoped Ubuntu meta package (linux-image-<flavor>-<series>), named in
# the `# renovate:` comment above it, so Renovate (.github/renovate.json5) only moves the ABI
# within the series. Every line needs that comment, with suite=<release>-updates. Moving a track to a new series (hwe
# going from 7.0 to 7.3) or adding a line is a deliberate change validated on hardware: a new
# series can break the EFA DKMS build.

# renovate: datasource=deb depName=linux-image-aws-7.0 registryUrl=https://archive.ubuntu.com/ubuntu?suite=noble-updates&components=main&binaryArch=amd64
aws hwe noble 7.0.0-1014-aws
