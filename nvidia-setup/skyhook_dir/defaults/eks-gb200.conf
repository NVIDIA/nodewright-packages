# EKS + GB200: opinionated defaults (override via NVIDIA_* env vars)
# Kernel: flavor, then lts or hwe per Ubuntu release, resolved in ../kernels.conf.
KERNEL_FLAVOR=aws
KERNEL_TRACK_noble=hwe
LUSTRE=aws
# EFA is the AWS EFA installer; EFA_DRIVER is the efa driver it ships, as
# `dkms status efa` reports it.
EFA=1.51.0
EFA_DRIVER=3.3.1
